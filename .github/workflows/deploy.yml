name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/bedside
            git pull origin main

            cd backend
            source venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            deactivate

            cd ../frontend
            npm ci
            npm run build

            # Requires the deploy user to have passwordless sudo for exactly
            # these two units (see README's deploy notes) - not for sudo in
            # general.
            sudo systemctl restart bedside-gunicorn
            sudo systemctl restart bedside-nextjs
