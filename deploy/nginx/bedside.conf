# nginx site config for Bedside.
#
# Setup on the VPS:
#   1. Replace bedside.example.com everywhere below with your real domain.
#   2. Put this file at /etc/nginx/sites-available/bedside.conf and symlink
#      it into /etc/nginx/sites-enabled/.
#   3. Run: sudo certbot --nginx -d bedside.example.com
#      Certbot rewrites the ssl_certificate/ssl_certificate_key paths below
#      to match the certificate it issues, and adds the HTTP -> HTTPS
#      redirect for you if the plain-HTTP server block below is still in
#      place when it runs. The paths shown here are what certbot's own
#      output looks like, so you can review the routing before running it.
#
# Assumes the app lives at /opt/bedside (see deploy/systemd/ and
# .github/workflows/deploy.yml, which use the same path).

upstream bedside_gunicorn {
    server unix:/run/bedside/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name bedside.example.com;

    # Required for certbot's HTTP-01 challenge before a certificate exists.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bedside.example.com;

    # --- certbot placeholders ---
    ssl_certificate     /etc/letsencrypt/live/bedside.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bedside.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Patient voice-note uploads (ConsultationAudioMessageView) can be a few
    # MB - default nginx limit (1M) would reject them with a 413.
    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Security headers. The patient voice-input feature (getUserMedia) only
    # works over HTTPS or on localhost regardless of this header - see the
    # README's "microphone requires HTTPS" note - but the header itself is
    # still needed to actually grant the permission to this origin.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    # Django's collectstatic / MEDIA_ROOT output - served directly by nginx,
    # never proxied to Gunicorn.
    location /static/ {
        alias /opt/bedside/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /opt/bedside/backend/media/;
        expires 7d;
        access_log off;
    }

    location /api/ {
        proxy_pass http://bedside_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://bedside_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> the Next.js app.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
